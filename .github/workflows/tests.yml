name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q agent_audit tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check coverage floors
        run: python scripts/coverage_report.py
      - name: Check mutation gate
        run: python scripts/mutation_check.py
      - name: Check the README against a fresh clone
        run: python scripts/quickstart_check.py
      - name: Run offline demo
        run: >-
          python -m agent_audit audit
          --input examples/demo_scores.csv
          --report outputs/demo_report.md
          --json outputs/demo_result.json
          --html outputs/demo_report.html
          --score-min 0
          --score-max 10
          --data-provenance synthetic
